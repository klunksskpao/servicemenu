<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    
    <!-- เพิ่ม Favicon (ไอคอนบนแท็บเบราว์เซอร์) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f97316'><path d='M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v3h-3v-3zm-3 3h3v3h-3v-3zm3 3h3v3h-3v-3zm-3-6h3v3h-3v-3zm-3 3h3v3h-3v-3zm3 3h3v3h-3v-3z'/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- เปลี่ยน URL ของไลบรารี QRCode เป็น jsDelivr เพื่อแก้ปัญหาการโหลดไม่สำเร็จ -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            /* พื้นหลังสีสันสวยงาม (Gradient) */
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            background-attachment: fixed;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* สำหรับปรับแต่ง Scrollbar หากเนื้อหายาวไป */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animation เวลากดปุ่ม */
        .btn-press:active {
            transform: scale(0.98);
        }
    </style>
</head>
<!-- เปลี่ยนจาก flex ธรรมดาเป็น flex-col เพื่อให้ Footer อยู่ด้านล่างการ์ด -->
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 text-gray-800">

    <div class="glass-card w-full max-w-md md:max-w-4xl rounded-3xl p-6 sm:p-10 flex flex-col md:flex-row gap-8 transition-all duration-300">
        
        <!-- ฝั่งซ้าย: ส่วนควบคุมและตั้งค่า -->
        <div class="flex-1 flex flex-col gap-5">
            <div class="text-center md:text-left mb-2">
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-500 to-pink-500 mb-2">
                    สร้างคิวอาร์โค้ด
                </h1>
                <p class="text-gray-500 text-sm">เปลี่ยนลิงก์หรือข้อความของคุณเป็น QR Code พร้อมปรับแต่งได้ตามใจชอบ</p>
            </div>

            <div class="flex flex-col gap-2">
                <label for="qr-text" class="text-sm font-semibold text-gray-700">ข้อความ หรือ URL <span class="text-red-500">*</span></label>
                <textarea id="qr-text" rows="3" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all resize-none shadow-sm"
                    placeholder="เช่น https://www.example.com หรือ ข้อความของคุณ"></textarea>
                <p id="error-msg" class="text-red-500 text-xs hidden">กรุณากรอกข้อความหรือ URL ก่อนสร้าง QR Code</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- เลือกความละเอียด -->
                <div class="flex flex-col gap-2">
                    <label for="qr-size" class="text-sm font-semibold text-gray-700">ความละเอียดของภาพ</label>
                    <select id="qr-size" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-400 shadow-sm appearance-none bg-white">
                        <option value="256">เล็ก (256x256 px)</option>
                        <option value="512" selected>ปานกลาง (512x512 px)</option>
                        <option value="1024">ใหญ่ (1024x1024 px)</option>
                        <option value="2048">ใหญ่มาก (2048x2048 px)</option>
                    </select>
                </div>
                <!-- กำหนด Margin (พื้นที่ว่างรอบๆ) -->
                <div class="flex flex-col gap-2">
                    <label for="qr-margin" class="text-sm font-semibold text-gray-700">ขอบภาพ (Margin)</label>
                    <select id="qr-margin" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-400 shadow-sm appearance-none bg-white">
                        <option value="1">น้อย</option>
                        <option value="2" selected>ปานกลาง</option>
                        <option value="4">กว้าง</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- สีพื้นหน้า -->
                <div class="flex flex-col gap-2">
                    <label for="qr-color-dark" class="text-sm font-semibold text-gray-700">สี QR Code</label>
                    <div class="flex items-center gap-2">
                        <input type="color" id="qr-color-dark" value="#000000" class="w-10 h-10 rounded cursor-pointer border-0 p-0 bg-transparent">
                        <span class="text-xs text-gray-500" id="dark-color-label">#000000</span>
                    </div>
                </div>
                <!-- สีพื้นหลัง -->
                <div class="flex flex-col gap-2">
                    <label for="qr-color-light" class="text-sm font-semibold text-gray-700">สีพื้นหลัง</label>
                    <div class="flex items-center gap-2">
                        <input type="color" id="qr-color-light" value="#ffffff" class="w-10 h-10 rounded cursor-pointer border-0 p-0 bg-transparent">
                        <span class="text-xs text-gray-500" id="light-color-label">#ffffff</span>
                    </div>
                </div>
            </div>

            <button id="generate-btn" class="mt-4 w-full bg-gradient-to-r from-orange-500 to-pink-500 hover:from-orange-600 hover:to-pink-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all btn-press">
                สร้าง QR Code
            </button>
        </div>

        <!-- ฝั่งขวา: แสดงผล QR Code -->
        <div class="flex-1 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center p-6 relative min-h-[300px]">
            
            <!-- ไอคอน Placeholder เมื่อยังไม่ได้สร้าง -->
            <div id="placeholder" class="text-gray-400 flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                </svg>
                <p class="text-sm">QR Code จะแสดงที่นี่</p>
            </div>

            <!-- คอนเทนเนอร์แสดง QR Code ของจริง -->
            <div id="qr-result-container" class="hidden flex-col items-center w-full">
                <!-- ภาพ QR Code ที่สร้างเสร็จ จะถูกจำกัดขนาดบนจอเพื่อความสวยงาม แต่ภาพจริงจะใหญ่ตามที่เลือก -->
                <img id="qr-image" src="" alt="Generated QR Code" class="shadow-md rounded-lg max-w-full h-auto max-h-[350px] object-contain transition-opacity duration-500 opacity-0 mb-6">
                
                <!-- ปุ่ม Download ที่จะโผล่มาหลังสร้างเสร็จ -->
                <button id="download-btn" class="w-full max-w-[250px] flex items-center justify-center gap-2 bg-gray-900 hover:bg-gray-800 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-all btn-press">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    บันทึกภาพ (Save)
                </button>
            </div>

        </div>
    </div>

    <!-- เพิ่ม Footer (ส่วนท้าย) -->
    <footer class="mt-8 text-center text-white drop-shadow-md">
        <p class="text-sm font-light opacity-90 mb-1">สร้างและพัฒนาโดย</p>
        <p class="text-lg font-semibold tracking-wide">สำนักคลัง อบจ.ศรีสะเกษ</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ดึง Elements ที่จำเป็น
            const textInput = document.getElementById('qr-text');
            const sizeInput = document.getElementById('qr-size');
            const marginInput = document.getElementById('qr-margin');
            const colorDarkInput = document.getElementById('qr-color-dark');
            const colorLightInput = document.getElementById('qr-color-light');
            
            const darkColorLabel = document.getElementById('dark-color-label');
            const lightColorLabel = document.getElementById('light-color-label');

            const generateBtn = document.getElementById('generate-btn');
            const downloadBtn = document.getElementById('download-btn');
            
            const errorMsg = document.getElementById('error-msg');
            const placeholder = document.getElementById('placeholder');
            const resultContainer = document.getElementById('qr-result-container');
            const qrImage = document.getElementById('qr-image');

            let currentQRCodeDataUrl = null;

            // อัพเดทตัวหนังสือแสดงรหัสสีเมื่อมีการเลือกสีใหม่
            colorDarkInput.addEventListener('input', (e) => {
                darkColorLabel.textContent = e.target.value.toUpperCase();
            });
            colorLightInput.addEventListener('input', (e) => {
                lightColorLabel.textContent = e.target.value.toUpperCase();
            });

            // ซ่อนข้อความแจ้งเตือนเมื่อเริ่มพิมพ์
            textInput.addEventListener('input', () => {
                if (textInput.value.trim() !== '') {
                    errorMsg.classList.add('hidden');
                    textInput.classList.remove('border-red-500', 'ring-red-200');
                    // รีเซ็ตข้อความแจ้งเตือนกลับเป็นค่าเริ่มต้น
                    errorMsg.textContent = 'กรุณากรอกข้อความหรือ URL ก่อนสร้าง QR Code';
                }
            });

            // ฟังก์ชันสำหรับสร้าง QR Code
            const generateQRCode = () => {
                // ป้องกัน Error กรณีที่ระบบโหลดไลบรารีไม่สำเร็จ
                if (typeof QRCode === 'undefined') {
                    errorMsg.textContent = 'ระบบโหลดไลบรารีไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ หรือตรวจสอบการเชื่อมต่อ/Adblocker';
                    errorMsg.classList.remove('hidden');
                    return;
                }

                const text = textInput.value.trim();
                
                // ตรวจสอบค่าว่าง
                if (!text) {
                    errorMsg.textContent = 'กรุณากรอกข้อความหรือ URL ก่อนสร้าง QR Code';
                    errorMsg.classList.remove('hidden');
                    textInput.classList.add('border-red-500', 'ring-red-200');
                    textInput.focus();
                    
                    // เพิ่ม Animation เขย่าเล็กน้อยเพื่อแจ้งเตือน
                    textInput.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 400 });
                    return;
                }

                // ดึงค่าการตั้งค่าจากฟอร์ม
                const size = parseInt(sizeInput.value);
                const margin = parseInt(marginInput.value);
                const colorDark = colorDarkInput.value;
                const colorLight = colorLightInput.value;

                // เปลี่ยนสถานะปุ่ม
                const originalBtnText = generateBtn.innerHTML;
                generateBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังสร้าง...';
                generateBtn.disabled = true;
                qrImage.classList.remove('opacity-100');
                qrImage.classList.add('opacity-0');

                // ใช้ไลบรารี QRCode.toDataURL สร้างภาพ
                QRCode.toDataURL(text, {
                    width: size,
                    margin: margin,
                    color: {
                        dark: colorDark,  // สี QR (Foreground)
                        light: colorLight // สีพื้นหลัง (Background)
                    },
                    errorCorrectionLevel: 'H' // ระดับการแก้ไขข้อผิดพลาดระดับสูงสุด
                }, function (err, url) {
                    if (err) {
                        console.error("Error generating QR Code:", err);
                        // เปลี่ยนจากการใช้ alert เป็นการแสดงข้อความแจ้งเตือนแบบ UI
                        errorMsg.textContent = 'เกิดข้อผิดพลาดในการสร้าง QR Code โปรดลองอีกครั้ง';
                        errorMsg.classList.remove('hidden');
                        generateBtn.innerHTML = originalBtnText;
                        generateBtn.disabled = false;
                        return;
                    }

                    // จัดการแสดงผล UI
                    setTimeout(() => {
                        currentQRCodeDataUrl = url;
                        qrImage.src = url;
                        
                        placeholder.classList.add('hidden');
                        resultContainer.classList.remove('hidden');
                        resultContainer.classList.add('flex');
                        
                        // ค่อยๆ Fade ภาพเข้ามา
                        setTimeout(() => {
                            qrImage.classList.remove('opacity-0');
                            qrImage.classList.add('opacity-100');
                        }, 50);

                        // คืนสถานะปุ่ม
                        generateBtn.innerHTML = originalBtnText;
                        generateBtn.disabled = false;
                    }, 500); // ดีเลย์เล็กน้อยให้ดูมี Animation โหลด
                });
            };

            // กดปุ่มสร้าง
            generateBtn.addEventListener('click', generateQRCode);

            // ฟังก์ชันดาวน์โหลดรูปภาพ
            downloadBtn.addEventListener('click', () => {
                if (!currentQRCodeDataUrl) return;
                
                // สร้าง tag <a> เพื่อใช้สำหรับการดาวน์โหลดไฟล์
                const link = document.createElement('a');
                link.download = `qrcode_${new Date().getTime()}.png`;
                link.href = currentQRCodeDataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });
    </script>
</body>
</html>
