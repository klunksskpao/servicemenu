<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Portal & Admin System</title>
    
    <!-- เพิ่ม Favicon -->
    <link id="favicon" rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f3f4f6;
            transition: background-color 0.3s;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .public-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #48bb78;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #48bb78;
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- แสดง Loading เบื้องต้นขณะโหลดไฟล์ JSON -->
        <div class="min-h-screen flex items-center justify-center bg-gray-100">
            <div class="text-xl text-gray-600"><i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <script>
        // ตัวแปรส่วนกลาง
        let menus = [];
        let ADMIN_PASSWORD = ""; 
        let appConfig = {
            logoUrl: 'logo.png',
            systemName: 'ศูนย์รวมบริการ (Service Portal)',
            systemDesc: 'เลือกบริการที่คุณต้องการใช้งานด้านล่าง',
            theme: 'purple'
        };
        const themes = {
            'purple': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'blue': 'linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%)',
            'green': 'linear-gradient(135deg, #064e3b 0%, #10b981 100%)',
            'dark': 'linear-gradient(135deg, #111827 0%, #374151 100%)',
            'orange': 'linear-gradient(135deg, #9a3412 0%, #f97316 100%)'
        };
        let isLoggedIn = sessionStorage.getItem('admin_logged_in') === 'true';
        let currentRoute = location.hash || '#/';

        // ฟังก์ชันดึงข้อมูลจากไฟล์ JSON แบบ Asynchronous
        async function loadInitialData() {
            // ข้อมูลจำลองกรณีรันผ่านไฟล์ HTML ตรงๆ หรือ Preview (ติด CORS หรือ URL ผิด)
            const defaultMenus = [
                { id: 1, name: "ระบบลงทะเบียน", url: "https://example.com/reg", icon: "fa-solid fa-id-card", isActive: true },
                { id: 2, name: "แจ้งซ่อมไอที", url: "https://example.com/it", icon: "fa-solid fa-wrench", isActive: true }
            ];
            
            ADMIN_PASSWORD = "admin123";

            // ตรวจสอบว่ารันบนเซิร์ฟเวอร์จริงหรือไม่ (http/https)
            const isWebServer = window.location.protocol === 'http:' || window.location.protocol === 'https:';

            if (isWebServer) {
                try {
                    // 1. ดึงข้อมูลรหัสผ่านจาก ps.json
                    const psResponse = await fetch('./ps.json');
                    if (psResponse.ok) {
                        const psData = await psResponse.json();
                        ADMIN_PASSWORD = psData.admin_password;
                    } else {
                        console.warn('ไม่พบไฟล์ ps.json ใช้รหัสผ่านเริ่มต้น');
                    }

                    // 2. ดึงข้อมูลเมนูจาก menu.json 
                    const savedMenus = localStorage.getItem('menus_data');
                    if (savedMenus) {
                        menus = JSON.parse(savedMenus);
                    } else {
                        const menuResponse = await fetch('./menu.json');
                        if (menuResponse.ok) {
                            menus = await menuResponse.json();
                        } else {
                            menus = defaultMenus;
                        }
                    }

                    // 3. ดึงข้อมูลการตั้งค่าหน้าเว็บ
                    const savedConfig = localStorage.getItem('app_config');
                    if (savedConfig) {
                        appConfig = JSON.parse(savedConfig);
                    } else {
                        const configResponse = await fetch('./config.json');
                        if (configResponse.ok) {
                            appConfig = await configResponse.json();
                        }
                    }
                } catch (error) {
                    console.warn("เข้าถึง JSON ไม่ได้ ใช้ข้อมูลเริ่มต้นแทน:", error.message);
                    const savedMenus = localStorage.getItem('menus_data');
                    menus = savedMenus ? JSON.parse(savedMenus) : defaultMenus;
                    const savedConfig = localStorage.getItem('app_config');
                    if (savedConfig) appConfig = JSON.parse(savedConfig);
                }
            } else {
                // รันในระบบ Preview (blob:) หรือเปิดไฟล์ตรงๆ (file:)
                const savedMenus = localStorage.getItem('menus_data');
                menus = savedMenus ? JSON.parse(savedMenus) : defaultMenus;
                const savedConfig = localStorage.getItem('app_config');
                if (savedConfig) appConfig = JSON.parse(savedConfig);
            }
            
            // อัปเดต Favicon ตามรูปโลโก้ที่ตั้งค่าไว้
            const faviconElement = document.getElementById('favicon');
            if (faviconElement && appConfig.logoUrl) {
                faviconElement.href = appConfig.logoUrl;
            }
            
            // เมื่อโหลดเสร็จ ให้วาดหน้าจอ
            renderApp();
        }

        // --- ระบบ Routing ---
        window.addEventListener('hashchange', () => {
            currentRoute = location.hash || '#/';
            renderApp();
        });

        async function saveMenus() {
            // สำหรับทดสอบผ่านหน้าเว็บ จะเซฟลง localStorage เผื่อไว้ด้วย
            localStorage.setItem('menus_data', JSON.stringify(menus));

            // ตรวจสอบว่ารันบนเว็บเซิร์ฟเวอร์หรือไม่
            const isWebServer = window.location.protocol === 'http:' || window.location.protocol === 'https:';
            
            if (isWebServer) {
                try {
                    // ส่งข้อมูลที่อัปเดตไปให้ไฟล์ save_menu.php เขียนทับไฟล์ menu.json
                    const response = await fetch('./save_menu.php', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify(menus)
                    });

                    const result = await response.json();
                    
                    if (response.ok && result.status === 'success') {
                        console.log('บันทึกทับไฟล์ menu.json สำเร็จ');
                    } else {
                        console.error('เกิดข้อผิดพลาดในการบันทึกไฟล์:', result.message);
                        alert('ไม่สามารถบันทึกไฟล์ได้: ' + result.message);
                    }
                } catch (error) {
                    console.error('เชื่อมต่อระบบบันทึกไฟล์ไม่สำเร็จ:', error);
                }
            }
        }

        async function saveConfigDataToServer() {
            // สำหรับทดสอบผ่านหน้าเว็บ จะเซฟลง localStorage เผื่อไว้ด้วย
            localStorage.setItem('app_config', JSON.stringify(appConfig));

            // ตรวจสอบว่ารันบนเว็บเซิร์ฟเวอร์หรือไม่
            const isWebServer = window.location.protocol === 'http:' || window.location.protocol === 'https:';
            
            if (isWebServer) {
                try {
                    const response = await fetch('./save_config.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(appConfig)
                    });
                    const result = await response.json();
                    if (!response.ok || result.status !== 'success') {
                        console.error('เกิดข้อผิดพลาดในการบันทึกการตั้งค่า:', result.message);
                    }
                } catch (error) {
                    console.error('เชื่อมต่อระบบบันทึกตั้งค่าไม่สำเร็จ:', error);
                }
            }
        }

        function renderPublic() {
            const activeMenus = menus.filter(m => m.isActive);
            let menuHtml = '';
            
            if (activeMenus.length === 0) {
                menuHtml = `<div class="col-span-full text-center text-white py-10">ยังไม่มีบริการที่เปิดใช้งานในขณะนี้</div>`;
            } else {
                activeMenus.forEach(menu => {
                    menuHtml += `
                        <a href="${menu.url}" target="_blank" class="glass-card flex flex-col items-center justify-center p-6 rounded-2xl hover:scale-105 hover:shadow-xl transition-all duration-300 text-gray-700 hover:text-indigo-600 group">
                            <div class="w-16 h-16 rounded-full bg-indigo-100 flex items-center justify-center mb-4 group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-300">
                                <i class="${menu.icon} text-3xl"></i>
                            </div>
                            <h3 class="text-lg font-semibold text-center">${menu.name}</h3>
                        </a>
                    `;
                });
            }

            return `
                <div class="public-bg py-12 px-4 sm:px-6 lg:px-8 flex flex-col items-center justify-between" style="background: ${themes[appConfig.theme] || themes['purple']}">
                    <div class="w-full max-w-5xl flex-1 flex flex-col">
                        <div class="text-center mb-10">
                            <!-- เพิ่ม โลโก้ตรงกลางด้านบน -->
                            <img src="${appConfig.logoUrl}" alt="Logo" class="mx-auto h-28 object-contain mb-6 drop-shadow-lg" onerror="this.onerror=null; this.src='https://placehold.co/200x200/ffffff/667eea?text=Logo';">
                            
                            <h1 class="text-4xl font-bold text-white mb-4 shadow-sm">${appConfig.systemName}</h1>
                            <p class="text-white/90 text-lg">${appConfig.systemDesc}</p>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 flex-grow">
                            ${menuHtml}
                        </div>
                        
                        <!-- เพิ่ม Footer (Footage) ด้านล่างสุด -->
                        <footer class="w-full text-center mt-16 pt-8 pb-4">
                            <p class="text-white/90 text-md font-medium tracking-wide">สำนักคลัง อบจ.ศรีสะเกษ</p>
                        </footer>
                    </div>

                    <!-- ปุ่มเข้าสู่ระบบแอดมิน (เปลี่ยนไปหน้า admin.html ได้ถ้าแยกไฟล์ หรือใช้ Hash ตามนี้) -->
                    <div class="fixed bottom-4 right-4 z-50">
                        <a href="#/login" class="text-white/50 hover:text-white text-sm bg-black/10 px-4 py-2 rounded-full backdrop-blur-sm transition-colors"><i class="fa-solid fa-lock"></i> สำหรับผู้ดูแลระบบ</a>
                    </div>
                </div>
            `;
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
                    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg">
                        <div>
                            <div class="mx-auto w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mb-4">
                                <i class="fa-solid fa-user-shield text-2xl text-indigo-600"></i>
                            </div>
                            <h2 class="text-center text-3xl font-extrabold text-gray-900">Admin Login</h2>
                            <p class="mt-2 text-center text-sm text-gray-600">เข้าสู่ระบบเพื่อจัดการเมนู</p>
                        </div>
                        <form class="mt-8 space-y-6" id="loginForm" onsubmit="handleLogin(event)">
                            <div class="rounded-md shadow-sm -space-y-px">
                                <div>
                                    <label for="password" class="sr-only">Password</label>
                                    <input id="password" name="password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="Password">
                                </div>
                            </div>
                            <div id="loginError" class="text-red-500 text-sm hidden text-center">รหัสผ่านไม่ถูกต้อง!</div>
                            <div>
                                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
                                    เข้าสู่ระบบ
                                </button>
                            </div>
                            <div class="text-center mt-4">
                                <a href="#/" class="text-indigo-600 hover:text-indigo-500 text-sm"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderAdmin() {
            let tableRows = '';
            
            menus.forEach((menu) => {
                tableRows += `
                    <tr class="hover:bg-gray-50 transition-colors border-b border-gray-200">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 mr-3">
                                    <i class="${menu.icon}"></i>
                                </div>
                                <div class="text-sm font-medium text-gray-900">${menu.name}</div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <a href="${menu.url}" target="_blank" class="text-indigo-600 hover:underline truncate max-w-[200px] inline-block" title="${menu.url}">${menu.url}</a>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <label class="flex items-center cursor-pointer">
                                <div class="relative">
                                    <input type="checkbox" class="sr-only" ${menu.isActive ? 'checked' : ''} onchange="toggleMenu(${menu.id})">
                                    <div class="block bg-gray-300 w-10 h-6 rounded-full transition-colors ${menu.isActive ? 'bg-green-500' : ''}"></div>
                                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${menu.isActive ? 'transform translate-x-4' : ''}"></div>
                                </div>
                                <div class="ml-3 text-sm font-medium ${menu.isActive ? 'text-green-600' : 'text-gray-500'}">
                                    ${menu.isActive ? 'เปิดใช้งาน' : 'ปิดใช้งาน'}
                                </div>
                            </label>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button onclick="openModal(${menu.id})" class="text-blue-600 hover:text-blue-900 mr-3 bg-blue-50 px-3 py-1 rounded-md hover:bg-blue-100 transition"><i class="fa-solid fa-pen-to-square"></i> แก้ไข</button>
                            <button onclick="deleteMenu(${menu.id})" class="text-red-600 hover:text-red-900 bg-red-50 px-3 py-1 rounded-md hover:bg-red-100 transition"><i class="fa-solid fa-trash"></i> ลบ</button>
                        </td>
                    </tr>
                `;
            });

            return `
                <div class="min-h-screen bg-gray-100">
                    <nav class="bg-white shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="flex justify-between h-16">
                                <div class="flex items-center">
                                    <i class="fa-solid fa-gear text-indigo-600 text-2xl mr-2"></i>
                                    <span class="font-bold text-xl text-gray-800">ระบบจัดการบริการ (Admin)</span>
                                </div>
                                <div class="flex items-center space-x-4">
                                    <a href="#/" class="text-gray-500 hover:text-indigo-600"><i class="fa-solid fa-eye"></i> ดูหน้าเว็บ</a>
                                    <button onclick="openConfigModal()" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-md hover:bg-blue-200 transition-colors text-sm font-medium">
                                        <i class="fa-solid fa-desktop"></i> ตั้งค่าหน้าเว็บ
                                    </button>
                                    <button onclick="openPasswordModal()" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-md hover:bg-indigo-200 transition-colors text-sm font-medium">
                                        <i class="fa-solid fa-key"></i> เปลี่ยนรหัสผ่าน
                                    </button>
                                    <button onclick="handleLogout()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-md hover:bg-red-500 hover:text-white transition-colors text-sm font-medium">
                                        <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-gray-800">รายการเมนูทั้งหมด</h2>
                            <button onclick="openModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 shadow-sm transition-colors flex items-center">
                                <i class="fa-solid fa-plus mr-2"></i> เพิ่มบริการใหม่
                            </button>
                        </div>

                        <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ชื่อบริการ & ไอคอน</th>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">URL Link</th>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">สถานะการใช้งาน</th>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">จัดการ</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200">
                                        ${menus.length > 0 ? tableRows : '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">ไม่มีข้อมูลเมนู กรุณาเพิ่มบริการใหม่</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Modal for Add/Edit -->
                <div id="menuModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50 flex items-center justify-center">
                    <div class="relative w-full max-w-md bg-white rounded-xl shadow-2xl p-8 m-4">
                        <h3 class="text-xl font-bold text-gray-900 mb-6" id="modalTitle">เพิ่มบริการใหม่</h3>
                        <form id="menuForm" onsubmit="saveMenuData(event)">
                            <input type="hidden" id="menuId">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อบริการ</label>
                                    <input type="text" id="menuName" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="เช่น ระบบจองห้อง">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">URL Link</label>
                                    <input type="url" id="menuUrl" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="https://...">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">
                                        คลาส Icon (FontAwesome) 
                                        <a href="https://fontawesome.com/search?o=r&m=free" target="_blank" class="text-indigo-500 text-xs ml-2 hover:underline">(ค้นหาไอคอน)</a>
                                    </label>
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded bg-gray-100 flex items-center justify-center text-gray-600 border border-gray-200">
                                            <i id="iconPreview" class="fa-solid fa-link"></i>
                                        </div>
                                        <input type="text" id="menuIcon" required class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="fa-solid fa-link" oninput="updateIconPreview()">
                                    </div>
                                </div>
                                <div class="flex items-center pt-2">
                                    <input type="checkbox" id="menuStatus" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                                    <label class="ml-2 block text-sm text-gray-900">เปิดใช้งานทันที</label>
                                </div>
                            </div>
                            <div class="mt-8 flex justify-end space-x-3">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-white border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition">ยกเลิก</button>
                                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">บันทึกข้อมูล</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Modal for Change Password -->
                <div id="passwordModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50 flex items-center justify-center">
                    <div class="relative w-full max-w-sm bg-white rounded-xl shadow-2xl p-8 m-4">
                        <h3 class="text-xl font-bold text-gray-900 mb-6">เปลี่ยนรหัสผ่านแอดมิน</h3>
                        <form id="passwordForm" onsubmit="saveNewPassword(event)">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่านใหม่</label>
                                    <input type="text" id="newPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="กรอกรหัสผ่านใหม่">
                                </div>
                            </div>
                            <div class="mt-8 flex justify-end space-x-3">
                                <button type="button" onclick="closePasswordModal()" class="px-4 py-2 bg-white border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition">ยกเลิก</button>
                                <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition">บันทึกรหัสผ่าน</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Modal for System Config -->
                <div id="configModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50 flex items-center justify-center">
                    <div class="relative w-full max-w-md bg-white rounded-xl shadow-2xl p-8 m-4">
                        <h3 class="text-xl font-bold text-gray-900 mb-6">ตั้งค่าหน้าเว็บ (Public)</h3>
                        <form id="configForm" onsubmit="handleSaveConfig(event)">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">URL รูปโลโก้</label>
                                    <input type="text" id="configLogo" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="logo.png หรือ https://...">
                                    <p class="text-xs text-gray-500 mt-1">ใช้ชื่อไฟล์รูปที่มีในเซิร์ฟเวอร์ หรือ URL รูปจากเว็บอื่น</p>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อระบบ (Title)</label>
                                    <input type="text" id="configName" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="เช่น ศูนย์รวมบริการ">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">รายละเอียด (Subtitle)</label>
                                    <input type="text" id="configDesc" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="คำอธิบายสั้นๆ">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">เฉดสีพื้นหลัง</label>
                                    <select id="configTheme" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                                        <option value="purple">ม่วง - คราม (Purple)</option>
                                        <option value="blue">น้ำเงิน - ฟ้า (Blue)</option>
                                        <option value="green">เขียว - มรกต (Green)</option>
                                        <option value="orange">ส้ม - แดง (Orange)</option>
                                        <option value="dark">มืด - ดำ (Dark)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mt-8 flex justify-end space-x-3">
                                <button type="button" onclick="closeConfigModal()" class="px-4 py-2 bg-white border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition">ยกเลิก</button>
                                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">บันทึกการตั้งค่า</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderApp() {
            const app = document.getElementById('app');
            
            if (currentRoute === '#/login') {
                if (isLoggedIn) {
                    location.hash = '#/admin';
                } else {
                    app.innerHTML = renderLogin();
                }
            } else if (currentRoute === '#/admin') {
                if (!isLoggedIn) {
                    location.hash = '#/login';
                } else {
                    app.innerHTML = renderAdmin();
                }
            } else {
                app.innerHTML = renderPublic();
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const passwordInput = document.getElementById('password').value;
            // เช็ครหัสผ่านที่โหลดมาจาก ps.json (หรือค่าเริ่มต้นถ้าโหลดไม่สำเร็จ)
            if (passwordInput === ADMIN_PASSWORD) {
                isLoggedIn = true;
                sessionStorage.setItem('admin_logged_in', 'true');
                location.hash = '#/admin';
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            isLoggedIn = false;
            sessionStorage.removeItem('admin_logged_in');
            location.hash = '#/login';
        }

        function toggleMenu(id) {
            const menuIndex = menus.findIndex(m => m.id === id);
            if (menuIndex !== -1) {
                menus[menuIndex].isActive = !menus[menuIndex].isActive;
                saveMenus();
                renderApp(); 
            }
        }

        function deleteMenu(id) {
            if(confirm('คุณแน่ใจหรือไม่ว่าต้องการลบบริการนี้?')) {
                menus = menus.filter(m => m.id !== id);
                saveMenus();
                renderApp();
            }
        }

        function updateIconPreview() {
            const iconClass = document.getElementById('menuIcon').value || 'fa-solid fa-link';
            document.getElementById('iconPreview').className = iconClass;
        }

        function openModal(id = null) {
            const modal = document.getElementById('menuModal');
            const form = document.getElementById('menuForm');
            const title = document.getElementById('modalTitle');
            
            form.reset();
            updateIconPreview();

            if (id) {
                const menu = menus.find(m => m.id === id);
                if (menu) {
                    document.getElementById('menuId').value = menu.id;
                    document.getElementById('menuName').value = menu.name;
                    document.getElementById('menuUrl').value = menu.url;
                    document.getElementById('menuIcon').value = menu.icon;
                    document.getElementById('menuStatus').checked = menu.isActive;
                    title.innerText = 'แก้ไขบริการ';
                    updateIconPreview();
                }
            } else {
                document.getElementById('menuId').value = '';
                document.getElementById('menuStatus').checked = true;
                title.innerText = 'เพิ่มบริการใหม่';
            }
            
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('menuModal').classList.add('hidden');
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
            document.getElementById('newPassword').value = '';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        async function saveNewPassword(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            
            if(!newPass) return;

            const isWebServer = window.location.protocol === 'http:' || window.location.protocol === 'https:';
            
            if (isWebServer) {
                try {
                    const response = await fetch('./save_password.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ admin_password: newPass })
                    });
                    const result = await response.json();
                    
                    if (response.ok && result.status === 'success') {
                        ADMIN_PASSWORD = newPass; // อัปเดตในหน่วยความจำชั่วคราว
                        alert('เปลี่ยนรหัสผ่านสำเร็จ!');
                        closePasswordModal();
                    } else {
                        alert('ไม่สามารถเปลี่ยนรหัสผ่านได้: ' + result.message);
                    }
                } catch (error) {
                    alert('เชื่อมต่อระบบเปลี่ยนรหัสผ่านไม่สำเร็จ: ' + error);
                }
            } else {
                // สำหรับโหมด Preview ใน Editor
                ADMIN_PASSWORD = newPass;
                alert('(ระบบจำลอง) เปลี่ยนรหัสผ่านสำเร็จ! รหัสผ่านใหม่คือ: ' + newPass);
                closePasswordModal();
            }
        }

        function openConfigModal() {
            document.getElementById('configModal').classList.remove('hidden');
            document.getElementById('configLogo').value = appConfig.logoUrl;
            document.getElementById('configName').value = appConfig.systemName;
            document.getElementById('configDesc').value = appConfig.systemDesc;
            document.getElementById('configTheme').value = appConfig.theme;
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.add('hidden');
        }

        function handleSaveConfig(e) {
            e.preventDefault();
            appConfig.logoUrl = document.getElementById('configLogo').value;
            appConfig.systemName = document.getElementById('configName').value;
            appConfig.systemDesc = document.getElementById('configDesc').value;
            appConfig.theme = document.getElementById('configTheme').value;
            
            saveConfigDataToServer();
            closeConfigModal();
            
            // อัปเดต Favicon ใหม่เมื่อบันทึกการตั้งค่า
            const faviconElement = document.getElementById('favicon');
            if (faviconElement && appConfig.logoUrl) {
                faviconElement.href = appConfig.logoUrl;
            }
            
            renderApp();
        }

        function saveMenuData(e) {
            e.preventDefault();
            
            const id = document.getElementById('menuId').value;
            const name = document.getElementById('menuName').value;
            const url = document.getElementById('menuUrl').value;
            const icon = document.getElementById('menuIcon').value;
            const isActive = document.getElementById('menuStatus').checked;

            if (id) {
                // แก้ไข
                const index = menus.findIndex(m => m.id == id);
                if (index !== -1) {
                    menus[index] = { ...menus[index], name, url, icon, isActive };
                }
            } else {
                // เพิ่มใหม่
                const newId = menus.length > 0 ? Math.max(...menus.map(m => m.id)) + 1 : 1;
                menus.push({ id: newId, name, url, icon, isActive });
            }

            saveMenus(); // เรียกบันทึก (ไปจำลอง/ไป API)
            closeModal();
            renderApp();
        }

        // เริ่มต้นการทำงานด้วยการเรียกฟังก์ชันโหลดข้อมูล
        window.onload = loadInitialData;

    </script>
</body>
</html>
